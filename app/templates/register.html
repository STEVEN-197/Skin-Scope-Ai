{% extends 'base.html' %}
{% block auth_content %}
<div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
  <h2 class="text-2xl font-semibold mb-2">Create account</h2>
  <p class="text-slate-500 mb-6">Securely store your diagnostics history</p>
  <form method="post" class="space-y-4">
    <input name="name" placeholder="Full Name" required class="w-full input" />
    <input name="email" type="email" placeholder="Email" required class="w-full input" />
    <input name="password" type="password" placeholder="Password (min 8 chars)" required class="w-full input" />
    <button class="w-full btn-primary">Register</button>
  </form>
  <p class="mt-4 text-sm">Have an account? <a class="text-teal-700" href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
