{% extends 'base.html' %}
{% block auth_content %}
<div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
  <h2 class="text-2xl font-semibold mb-2">Welcome back</h2>
  <p class="text-slate-500 mb-6">Login to SkinScope AI</p>
  <form method="post" class="space-y-4">
    <input name="email" type="email" placeholder="Email" required class="w-full input" />
    <input name="password" type="password" placeholder="Password" required class="w-full input" />
    <button class="w-full btn-primary">Login</button>
  </form>
  <p class="mt-4 text-sm">New user? <a class="text-teal-700" href="{{ url_for('auth.register') }}">Create account</a></p>
</div>
{% endblock %}
