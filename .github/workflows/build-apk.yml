name: Build Native Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build Native Android APK (SkinScope AI → Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Install Android SDK 36 Platform & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: 🟩 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      # Build client-only bundle (serves as offline fallback inside APK).
      # The primary app source is the live Vercel URL set in capacitor.config.ts.
      # We clear postbuild to skip the SSR prerender step which requires dist/server.
      - name: 🏗️ Build Client Bundle (offline fallback assets)
        env:
          VITE_SUPABASE_URL: https://nrvptzzddpenyvcndcph.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ydnB0enpkZHBlbnl2Y25kY3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MTA3NzgsImV4cCI6MjA5MjI4Njc3OH0.ezxhA48lnXD_wFwyBHbwPCzLhjFPp54TrFGKc51Yf6E
          VITE_SUPABASE_PROJECT_ID: nrvptzzddpenyvcndcph
        run: |
          # Clear postbuild to skip SSR prerender (not needed for APK)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.scripts.postbuild = '';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('✅ postbuild cleared');
          "
          npx vite build
          echo "✅ Client bundle built"
          ls -lh dist/client/ 2>/dev/null || ls -lh dist/ 2>/dev/null || echo "⚠️ dist/ not found"

      - name: 🔄 Sync Capacitor Config & Plugins to Android
        env:
          VITE_SUPABASE_URL: https://nrvptzzddpenyvcndcph.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ydnB0enpkZHBlbnl2Y25kY3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MTA3NzgsImV4cCI6MjA5MjI4Njc3OH0.ezxhA48lnXD_wFwyBHbwPCzLhjFPp54TrFGKc51Yf6E
        run: |
          # Cap sync copies capacitor.config.json (with server.url=Vercel) into the APK
          npx cap sync android
          echo "✅ Cap sync complete — Vercel URL baked into capacitor.config.json"
          # Show the generated capacitor config to confirm server.url is set
          cat android/app/src/main/assets/capacitor.config.json || true

      - name: 🔑 Grant Execute Permissions for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: 🔨 Compile Native Android APK (assembleDebug)
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/SkinScopeAI-v1.0.0-debug.apk
          APK_SIZE=$(ls -lh release-apk/SkinScopeAI-v1.0.0-debug.apk | awk '{print $5}')
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "✅ APK ready: SkinScopeAI-v1.0.0-debug.apk ($APK_SIZE)"

      - name: 📊 Embed Build Summary
        run: |
          echo "## 📱 SkinScope AI — Native Android APK (Vercel Edition)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Live Vercel App inside a Native Android Shell**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | SkinScope AI |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`app.lovable.skinscopeai\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web Source** | 🌐 \`https://skinscopeai-main.vercel.app\` (live) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Native Shell** | ✅ Capacitor 7.x + Android SDK 36 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Offline Fallback** | ✅ Bundled client assets |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | Android 15 (API 35) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Min SDK** | Android 7.0 (API 24) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Router** | Browser history (Vercel handles routing) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auth** | Supabase (same backend as web) |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Size** | ${{ env.APK_SIZE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Status** | ✅ SUCCESS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ Architecture" >> $GITHUB_STEP_SUMMARY
          echo '```mermaid' >> $GITHUB_STEP_SUMMARY
          echo 'graph TD' >> $GITHUB_STEP_SUMMARY
          echo '    APK["📱 SkinScopeAI-v1.0.0-debug.apk"]' >> $GITHUB_STEP_SUMMARY
          echo '    APK --> SHELL["Native Android Shell (Capacitor)"]' >> $GITHUB_STEP_SUMMARY
          echo '    SHELL --> SPLASH["Splash Screen + Status Bar"]' >> $GITHUB_STEP_SUMMARY
          echo '    SHELL --> WEB["WebView → skinscopeai-main.vercel.app"]' >> $GITHUB_STEP_SUMMARY
          echo '    SHELL --> CAM["Native Camera Access"]' >> $GITHUB_STEP_SUMMARY
          echo '    WEB --> VERCEL["☁️ Vercel CDN (always latest)"]' >> $GITHUB_STEP_SUMMARY
          echo '    VERCEL --> REACT["TanStack React UI"]' >> $GITHUB_STEP_SUMMARY
          echo '    REACT --> SB["🔐 Supabase Auth + DB"]' >> $GITHUB_STEP_SUMMARY
          echo '    REACT --> AI["🧠 AI Skin Analysis"]' >> $GITHUB_STEP_SUMMARY
          echo '    SHELL -.->|"offline fallback"| BUNDLE["Bundled dist/client"]' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to Install" >> $GITHUB_STEP_SUMMARY
          echo "1. Download **SkinScope-AI-Native-APK** from Artifacts below" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer \`.apk\` to your Android phone" >> $GITHUB_STEP_SUMMARY
          echo "3. Settings → Security → **Install from Unknown Sources** → ON" >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the APK → Install" >> $GITHUB_STEP_SUMMARY
          echo "5. Open **SkinScope AI** — it loads the live Vercel app in a native shell 🚀" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkinScope-AI-Native-APK
          path: release-apk/SkinScopeAI-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
