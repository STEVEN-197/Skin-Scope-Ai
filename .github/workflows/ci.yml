name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for Bun
        id: pm_check
        run: |
          if [ -f "bun.lockb" ]; then echo "bun=true" >> "$GITHUB_OUTPUT"; else echo "bun=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun (when present)
        if: steps.pm_check.outputs.bun == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ "${{ steps.pm_check.outputs.bun }}" == "true" ]; then
            bun install
          else
            npm ci
          fi

      - name: Build
        id: build_step
        env:
          VITE_SUPABASE_URL: "https://nrvptzzddpenyvcndcph.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ydnB0enpkZHBlbnl2Y25kY3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MTA3NzgsImV4cCI6MjA5MjI4Njc3OH0.ezxhA48lnXD_wFwyBHbwPCzLhjFPp54TrFGKc51Yf6E"
          VITE_SUPABASE_PROJECT_ID: "nrvptzzddpenyvcndcph"
          DANGEROUSLY_DEPLOY_VULNERABLE_TANSTACK_START_XSS: "1"
        run: |
          set -o pipefail
          if [ "${{ steps.pm_check.outputs.bun }}" == "true" ]; then
            bun run build 2>&1 | tee build.log
          else
            npm run build 2>&1 | tee build.log
          fi

      - name: Upload build log and artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: |
            build.log
            dist/

      - name: Generate build-summary
        if: always()
        run: |
          if grep -q "error" build.log -i; then echo "BUILD_STATUS=FAIL" > build-summary.txt; else echo "BUILD_STATUS=PASS" > build-summary.txt; fi
          echo "Build log size:" $(wc -c < build.log) >> build-summary.txt
      - name: Upload build summary
        uses: actions/upload-artifact@v5
        with:
          name: build-summary
          path: build-summary.txt

  deploy_preview:
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      preview_url: ${{ steps.vercel_deploy.outputs.preview_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: build_artifacts

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Deploy to Vercel (production)
        id: vercel_deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN provided; skipping deploy"
            echo "preview_url=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Installing vercel CLI"
          npm i -g vercel@latest || true
          echo "Linking Vercel project skinscopeai-main"
          mkdir -p .vercel
          cat << 'EOF' > .vercel/project.json
          {"projectId":"prj_JcKAqg0iLG7YpGYJYEUuuidkDnJf","orgId":"team_I1xsSxCdaleG5NjpBAxDzx1w","projectName":"skinscopeai-main"}
          EOF

          # Prepare Build Output API v3 (.vercel/output) from verified build_artifacts/dist/client
          mkdir -p .vercel/output/static
          cp -r build_artifacts/dist/client/* .vercel/output/static/
          cat << 'EOF' > .vercel/output/config.json
          {
            "version": 3,
            "routes": [
              {
                "src": "/(.*)",
                "headers": {
                  "Strict-Transport-Security": "max-age=63072000; includeSubDomains; preload",
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "X-XSS-Protection": "1; mode=block",
                  "X-Permitted-Cross-Domain-Policies": "none",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "Permissions-Policy": "camera=(self), microphone=(), geolocation=()"
                },
                "continue": true
              },
              {
                "src": "/assets/(.*)",
                "headers": {
                  "Cache-Control": "public, max-age=31536000, immutable"
                },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

          echo "Verifying .vercel/output/static/index.html size:"
          ls -lh .vercel/output/static/index.html
          head -c 200 .vercel/output/static/index.html
          echo ""

          echo "Deploying prebuilt output to Vercel PRODUCTION"
          npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee vercel.out || \
          npx vercel --token "$VERCEL_TOKEN" --prod --yes \
            --build-env DANGEROUSLY_DEPLOY_VULNERABLE_TANSTACK_START_XSS=1 \
            --build-env VITE_SUPABASE_URL="https://nrvptzzddpenyvcndcph.supabase.co" \
            --build-env VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ydnB0enpkZHBlbnl2Y25kY3BoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MTA3NzgsImV4cCI6MjA5MjI4Njc3OH0.ezxhA48lnXD_wFwyBHbwPCzLhjFPp54TrFGKc51Yf6E" \
            2>&1 | tee -a vercel.out || true

          # Parse production deployment URL from output
          PROD_URL=$(grep -oE "https?://skinscopeai-main\.vercel\.app" vercel.out | head -n1 || true)
          PREVIEW_URL=$(grep -oE "https?://[a-zA-Z0-9.-]+\.vercel\.app" vercel.out | head -n1 || true)
          DEPLOY_URL="${PROD_URL:-$PREVIEW_URL}"
          echo "Deployed URL: $DEPLOY_URL"
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_I1xsSxCdaleG5NjpBAxDzx1w
          VERCEL_PROJECT_ID: prj_JcKAqg0iLG7YpGYJYEUuuidkDnJf

  selenium:
    runs-on: ubuntu-24.04
    needs: [build, deploy_preview]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: build_artifacts

      - name: Setup Node (for static server)
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Serve `dist/` on :8080 or use preview URL
        run: |
          echo "Using PREVIEW_URL=${{ needs.deploy_preview.outputs.preview_url }}"
          if [ -n "${{ needs.deploy_preview.outputs.preview_url }}" ]; then
            echo "Preview URL provided, skipping local server"
          else
            ls -la build_artifacts || true
            if [ -d build_artifacts/dist/client ]; then npx http-server build_artifacts/dist/client -p 8080 --silent &
            elif [ -d build_artifacts/dist ]; then npx http-server build_artifacts/dist -p 8080 --silent &
            else echo "dist not found in artifact"; fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser chromium-chromedriver

      - name: Install Selenium python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f tests/selenium/requirements.txt ]; then pip install -r tests/selenium/requirements.txt; fi

      - name: Run Selenium tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SKINSCOPE_BASE_URL: ${{ needs.deploy_preview.outputs.preview_url || 'http://localhost:8080' }}
          PYTHONPATH: .
        run: |
          echo "Testing against $SKINSCOPE_BASE_URL"
          xvfb-run -a pytest tests/selenium -k "not requires_preview" --junitxml=selenium-results.xml || true

      - name: Render test charts in GitHub Summary
        if: always()
        run: |
          python scripts/generate-test-summary.py || true

      - name: Upload Selenium results
        uses: actions/upload-artifact@v5
        with:
          name: selenium-results
          path: selenium-results.xml

  checks:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: TypeScript check (no emit)
        id: tsc
        run: |
          npx tsc --noEmit 2>&1 | tee tsc-output.txt || true

      - name: ESLint report
        id: eslint
        run: |
          npx eslint "src/**/*.{ts,tsx,js,jsx}" -f unix 2>&1 | tee eslint-output.txt || true

      - name: Upload static-analysis artifacts
        uses: actions/upload-artifact@v5
        with:
          name: static-analysis
          path: |
            tsc-output.txt
            eslint-output.txt

      - name: Summarize checks
        run: |
          echo "TSC_ERRORS=$(grep -ic "error" tsc-output.txt || true)" > checks-summary.txt
          echo "ESLINT_ERRORS=$(grep -ic "error" eslint-output.txt || true)" >> checks-summary.txt
        continue-on-error: true
      - name: Upload checks summary
        uses: actions/upload-artifact@v5
        with:
          name: checks-summary
          path: checks-summary.txt

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Scan repository for leaked tokens (sk_live_, sk_test_, service_role)
        run: |
          set -e
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git "sk_live_\|sk_test_\|service_role\|SUPABASE_SERVICE_ROLE_KEY\|LOVABLE_API_KEY" || true
        continue-on-error: true
      - name: Upload secret-scan results
        run: |
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git "sk_live_\|sk_test_\|service_role\|SUPABASE_SERVICE_ROLE_KEY\|LOVABLE_API_KEY" > secret-scan.txt || true
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: secret-scan
          path: secret-scan.txt

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install deps
        run: npm ci
      - name: Run linters
        run: npm run lint || true

  deploy_netlify:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist/client'
          production-branch: main
          production-deploy: true
          deploy-message: 'Deploy from GitHub Actions - ${{ github.sha }}'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
