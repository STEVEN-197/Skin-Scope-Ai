name: Android Build Readiness

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget lib32stdc++6 lib32z1
          mkdir -p $ANDROID_SDK_ROOT
          cd /tmp
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT
          mv $ANDROID_SDK_ROOT/cmdline-tools $ANDROID_SDK_ROOT/tools
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Prepare Capacitor Android
        run: |
          npx cap sync android || true

      - name: Run Gradle assemble (debug)
        working-directory: android
        run: ./gradlew assembleDebug -Porg.gradle.jvmargs='-Xmx2048m'
        continue-on-error: true

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/app/build/outputs/

      - name: Android readiness report
        run: |
          echo "ANDROID_BUILD_ATTEMPTED=true" > android-readiness.txt
          if [ -d android/app/build/outputs/apk/debug ]; then echo "APK_DEBUG_PRESENT=true" >> android-readiness.txt; else echo "APK_DEBUG_PRESENT=false" >> android-readiness.txt; fi
        continue-on-error: true
      - name: Setup Python for Appium
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Appium test requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f tests/appium/requirements.txt ]; then pip install -r tests/appium/requirements.txt; fi

      - name: Run Appium test suite & generate reports
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python tests/appium/run_and_report.py || true

      - name: Render Appium charts in GitHub Summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET, os
          sf = os.getenv('GITHUB_STEP_SUMMARY')
          junit = 'tests/mobile-reports/appium_junit.xml'
          if sf and os.path.exists(junit):
              tree = ET.parse(junit)
              t = p = f = s = 0
              for tc in tree.iter('testcase'):
                  t += 1
                  if tc.find('failure') is not None or tc.find('error') is not None: f += 1
                  elif tc.find('skipped') is not None: s += 1
                  else: p += 1
              with open(sf, 'a', encoding='utf-8') as out:
                  out.write(f'''
          ## 📱 Appium Android Mobile Flow Results

          \`\`\`mermaid
          pie title Mobile Automation Results (Total: {t})
              \"Passed ({p})\" : {p}
              \"Failed ({f})\" : {f}
              \"Skipped ({s})\" : {s}
          \`\`\`
          ''')
          " || true

      - name: Upload Appium reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: |
            tests/mobile-reports/
            tests/mobile-screenshots/

      - name: Upload android readiness report
        uses: actions/upload-artifact@v4
        with:
          name: android-readiness
          path: android-readiness.txt
